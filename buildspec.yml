cat > buildspec.yml <<'EOF'
version: 0.2

env:
  variables:
    AWS_ACCOUNT_ID: "488914879248"
    AWS_DEFAULT_REGION: "ap-south-1"

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com

  build:
    commands:
      - echo Building Insurance image
      - cd insurance
      - docker build -t hdfc-insurance:latest .
      - docker tag hdfc-insurance:latest $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/hdfc-insurance:latest
      - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/hdfc-insurance:latest
      - cd ..

  post_build:
    commands:
      - echo Insurance application built successfully
EOF
